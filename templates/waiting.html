{% extends 'base.html' %}

{% block content %}

<main style="margin-top: 80px;">

<h2 style="text-align: center;">Tutor Dashboard 👨‍🏫</h2>
 <p style="text-align: center;">Welcome, {{ session['name'] }} 👋</p>

<div class="container mt-5">
    <div class="row justify-content-center text-center">

        <!-- Add Slot Card -->
        <div class="col-md-4 mb-4">
            <div class="card shadow h-100 p-4">
                <div class="card-body">
                    <h5 class="card-title">➕ Add Slot</h5>
                    <p class="card-text">
                        Create new available time slots for students to book sessions.
                    </p>
                    <a href="/add-slot" class="btn btn-primary">Add Slot</a>
                </div>
            </div>
        </div>

        <!-- My Slots Card -->
        <div class="col-md-4 mb-4">
            <div class="card shadow h-100 p-4">
                <div class="card-body">
                    <h5 class="card-title">📅 My Slots</h5>
                    <p class="card-text">
                        View and manage all your created time slots easily.
                    </p>
                    <a href="/my-slots" class="btn btn-success">View Slots</a>
                </div>
            </div>
        </div>

    </div>
</div>

</main>

{% endblock %}
