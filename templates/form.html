<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    /* background: linear-gradient(to right, purple, #6a0dad); */
    overflow-y: auto;
    
}

.card{
    border-radius: 15px;
    /* min-height: 950px; */
   
   
}
</style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center ">
    
    <div class="card shadow p-4" style="width: 600px;">
        <h3 class="text-center mb-3">Details Form</h3>

        <form method="POST" enctype="multipart/form-data">

             <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter email" required>
            </div>

              <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" name="phone" class="form-control" placeholder="Enter Phone Number" required>
            </div>

            
              <div class="mb-3">
                <label class="form-label">Qualification</label>
                <input type="text" name="qualification" class="form-control" placeholder="Enter your Qualification" required>
            </div>

            
              <div class="mb-3">
                <label class="form-label">Years of Experience</label>
                <input type="number" name="years" class="form-control" placeholder="Enter your years of experience" required>
            </div>

            
              <div class="mb-3">
                <label class="form-label">Subjects </label>
                <input type="text" name="subjects" class="form-control" placeholder="Enter subjects that you teach" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mode</label>
                <select name="mode" class="form-select">
                    <option value="" disabled selected hidden>Select Mode</option>
                    <option value="online">Online</option>
                    <option value="offline">Offline</option>
                    <option value="both">Both</option>
                   
                </select>
            </div>

        

            <div class="mb-3">
    <label class="form-label">Address</label>
    <textarea name="address" class="form-control" rows="3" placeholder="Enter your address" required></textarea>
</div>


      <div class="mb-3">
                <label class="form-label">Resume Upload</label>
                <input type="file" name="file" class="form-control" placeholder="Enter email" required>
            </div>



  <!-- Skills -->
  <div class="mb-3">
    <label class="form-label">Skills</label>
    <input type="text" name="skills" class="form-control" placeholder="e.g. Python, HTML, CSS">
  </div> 

           

            <button type="submit" class="btn btn-dark w-100">Submit Details</button>

        </form>

        <!-- <p class="text-center mt-3">
            Don’t have an account? 
            <a href="/register">Register</a>
        </p> -->
    </div>

</div>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
